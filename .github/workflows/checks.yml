name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker compose config --quiet
      - run: docker build -t docker-cloud-backup:local .
      - run: pytest -q tests/test_docker_integration.py
        env:
          RUN_DOCKER_TESTS: '1'
