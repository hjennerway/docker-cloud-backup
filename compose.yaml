services:
  cloud-backup:
    image: ghcr.io/hjennerway/docker-cloud-backup:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 3m
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8088}:8080"
    environment:
      TZ: ${TZ:-Europe/London}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STACKS_ROOT: ${STACKS_ROOT:-/opt/stacks}
      MAX_BACKUP_GB: ${MAX_BACKUP_GB:-10}
      DOCKER_HOSTS_FILE: ${DOCKER_HOSTS_FILE:-}
    volumes:
      - backup-data:/data
      # Optional: mount ./docker-hosts.json:/run/docker-hosts.json:ro and set
      # DOCKER_HOSTS_FILE=/run/docker-hosts.json to manage other hosts.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read Compose files at paths recorded in Docker labels; never write to host.
      - /:/host:ro
    labels:
      cloud-backup.exclude: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Read Compose/.env files owned by other UIDs through the read-only mount.
      - DAC_READ_SEARCH
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  backup-data:
